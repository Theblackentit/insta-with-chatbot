<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Instagram</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#000;--s1:#121212;--s2:#1c1c1c;--s3:#262626;--s4:#363636;
  --text:#fff;--muted:#a8a8a8;--border:#363636;
  --accent:#0095f6;--like:#ed4956;--gold:#f5c518;
  --story:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5);
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
input,textarea,button,select{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--s4);border-radius:4px}

/* ── LAYOUT ── */
.app{display:flex;min-height:100vh}
.sidebar{width:245px;border-right:1px solid var(--border);padding:8px 12px 20px;position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;z-index:100;background:var(--bg);transition:width .2s}
.sidebar-logo{padding:26px 12px 18px;font-family:"Billabong","Dancing Script",cursive;font-size:26px;letter-spacing:-.5px;cursor:default;display:flex;align-items:center;gap:8px}
.nav-item{display:flex;align-items:center;gap:16px;padding:12px;border-radius:10px;cursor:pointer;border:none;background:none;color:var(--text);font-size:16px;width:100%;text-align:left;transition:background .1s;font-weight:400;position:relative}
.nav-item:hover{background:var(--s3)}
.nav-item.active{font-weight:700}
.nav-item.active svg{stroke-width:2.5}
.nav-icon{width:24px;height:24px;flex-shrink:0}
.sidebar-gap{flex:1}
.main{margin-left:245px;flex:1;display:flex;justify-content:center;align-items:flex-start;min-height:100vh}
.content-wrap{display:flex;width:100%;max-width:975px;padding:0 20px}
.feed-col{flex:1;max-width:470px;padding:24px 0;margin:0 auto}
.right-col{width:290px;flex-shrink:0;padding:24px 0 24px 28px;position:sticky;top:0;max-height:100vh;overflow-y:auto}
.right-col::-webkit-scrollbar{display:none}

/* ── STORIES ── */
.stories-bar{display:flex;gap:16px;padding:8px 0 20px;overflow-x:auto;border-bottom:1px solid var(--border);margin-bottom:16px;scrollbar-width:none}
.stories-bar::-webkit-scrollbar{display:none}
.story-item{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;flex-shrink:0;border:none;background:none;color:var(--text)}
.story-ring{width:56px;height:56px;border-radius:50%;background:var(--story);padding:2.5px;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
.story-ring:hover{opacity:.85}
.story-ring.seen{background:var(--s4)}
.story-avatar{width:100%;height:100%;border-radius:50%;object-fit:cover;border:2.5px solid var(--bg)}
.story-name{font-size:12px;max-width:64px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.your-story-add{position:relative}
.story-plus{position:absolute;bottom:0;right:0;width:18px;height:18px;background:var(--accent);border-radius:50%;border:2px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;line-height:1}

/* ── POST CARD ── */
.post-card{background:var(--bg);margin-bottom:12px;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.post-header{display:flex;align-items:center;padding:14px 16px;gap:10px}
.post-av{width:32px;height:32px;border-radius:50%;object-fit:cover;cursor:pointer;flex-shrink:0;border:1px solid var(--border)}
.post-user-info{flex:1;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.post-username{font-weight:600;font-size:14px;cursor:pointer;color:var(--text);background:none;border:none;padding:0}
.post-username:hover{color:var(--muted)}
.post-dot{color:var(--muted);font-size:12px}
.post-time{color:var(--muted);font-size:12px}
.post-follow{background:none;border:none;color:var(--accent);font-size:14px;font-weight:600;padding:0;margin-left:auto;flex-shrink:0}
.post-more{background:none;border:none;color:var(--text);padding:4px 8px;margin-left:4px;border-radius:4px;display:flex;align-items:center}
.post-more:hover{background:var(--s3)}
.post-img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;cursor:pointer}
.post-actions{display:flex;align-items:center;padding:4px 8px}
.act-btn{background:none;border:none;color:var(--text);padding:8px;display:flex;align-items:center;border-radius:50%;transition:background .1s}
.act-btn:hover{background:var(--s3)}
.act-btn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.act-btn.liked svg{fill:var(--like);stroke:var(--like);animation:heartPop .35s ease}
.act-btn.saved svg{fill:var(--text);stroke:var(--text)}
.act-save{margin-left:auto}
.post-likes{padding:2px 16px;font-weight:600;font-size:14px;cursor:pointer}
.post-caption{padding:4px 16px 2px;font-size:14px;word-break:break-word}
.post-caption .cap-user{font-weight:600;cursor:pointer;margin-right:4px}
.post-caption .cap-user:hover{color:var(--muted)}
.post-view-comments{padding:2px 16px;color:var(--muted);font-size:14px;cursor:pointer;background:none;border:none;display:block;text-align:left;width:auto}
.post-add-comment{display:flex;align-items:center;padding:8px 16px 12px;gap:8px;border-top:1px solid var(--border);margin-top:6px}
.post-comment-input{flex:1;background:none;border:none;color:var(--text);font-size:14px;outline:none}
.post-comment-input::placeholder{color:var(--muted)}
.post-post-btn{background:none;border:none;color:var(--accent);font-weight:600;font-size:14px;padding:0;opacity:.4;transition:opacity .2s;white-space:nowrap}
.post-post-btn.on{opacity:1}

/* ── RIGHT SIDEBAR ── */
.active-row{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.active-av{width:56px;height:56px;border-radius:50%;object-fit:cover;cursor:pointer;flex-shrink:0;border:1px solid var(--border)}
.active-info{flex:1;min-width:0}
.active-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.active-handle{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switch-btn{background:none;border:none;color:var(--accent);font-weight:600;font-size:12px}
.sugg-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sugg-title{color:var(--muted);font-weight:600;font-size:14px}
.see-all{font-size:12px;font-weight:600;color:var(--text);background:none;border:none}
.sugg-item{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sugg-av{width:32px;height:32px;border-radius:50%;object-fit:cover;cursor:pointer;flex-shrink:0;border:1px solid var(--border)}
.sugg-info{flex:1;min-width:0}
.sugg-name{font-weight:600;font-size:14px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:none;color:var(--text);padding:0;text-align:left}
.sugg-name:hover{color:var(--muted)}
.sugg-meta{color:var(--muted);font-size:12px}
.follow-btn{background:none;border:none;color:var(--accent);font-weight:600;font-size:12px;flex-shrink:0}
.follow-btn.following{color:var(--muted)}

/* ── EXPLORE ── */
.explore-wrap{padding:0;width:100%;max-width:935px}
.explore-search-bar{padding:16px 20px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--border)}
.explore-search{width:100%;max-width:400px;background:var(--s3);border:none;border-radius:10px;padding:10px 14px;color:var(--text);outline:none;font-size:16px}
.explore-search::placeholder{color:var(--muted)}
.explore-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px}
.exp-tile{aspect-ratio:1;overflow:hidden;cursor:pointer;position:relative;background:var(--s3)}
.exp-tile.tall{grid-row:span 2}
.exp-tile img{width:100%;height:100%;object-fit:cover;transition:filter .2s,transform .2s}
.exp-tile:hover img{filter:brightness(.7);transform:scale(1.02)}
.exp-tile-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;background:rgba(0,0,0,.4)}
.exp-tile:hover .exp-tile-overlay{opacity:1}
.exp-like-count{color:#fff;font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px}

/* ── REELS ── */
.reels-wrap{display:flex;flex-direction:column;align-items:center;padding:0;width:100%;max-width:500px;margin:0 auto}
.reel-card{width:100%;max-width:400px;height:88vh;position:relative;border-radius:12px;overflow:hidden;background:var(--s3);margin-bottom:16px;flex-shrink:0;cursor:pointer}
.reel-img{width:100%;height:100%;object-fit:cover}
.reel-overlay{position:absolute;bottom:0;left:0;right:0;padding:20px;background:linear-gradient(0deg,rgba(0,0,0,.85) 0%,transparent 70%)}
.reel-user-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.reel-av{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.reel-username{font-weight:700;font-size:14px}
.reel-follow-btn{background:none;border:1px solid #fff;color:#fff;border-radius:6px;padding:4px 12px;font-size:13px;font-weight:600}
.reel-caption{font-size:14px;color:#eee;max-height:60px;overflow:hidden}
.reel-actions{position:absolute;right:12px;bottom:80px;display:flex;flex-direction:column;gap:24px;align-items:center}
.reel-act{background:none;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px}
.reel-act svg{width:28px;height:28px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.reel-act.liked svg{fill:var(--like);stroke:var(--like)}

/* ── PROFILE ── */
.profile-wrap{width:100%;max-width:935px;padding:30px 20px;margin:0 auto}
.profile-top{display:grid;grid-template-columns:150px 1fr;gap:20px 40px;margin-bottom:44px;align-items:start}
.profile-av-ring{width:150px;height:150px;border-radius:50%;background:var(--story);padding:3px;flex-shrink:0}
.profile-av-img{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--bg)}
.profile-right{padding-top:10px}
.profile-name-row{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.profile-uname{font-size:20px;font-weight:300}
.profile-action-btns{display:flex;gap:8px}
.profile-btn{padding:7px 16px;border-radius:8px;font-weight:600;font-size:14px;border:1px solid var(--border);background:var(--s3);color:var(--text)}
.profile-btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.profile-btn.following{background:var(--s3)}
.profile-stats{display:flex;gap:40px;margin-bottom:16px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;align-items:center;gap:2px}
.stat-num{font-weight:700;font-size:16px}
.stat-lbl{font-size:14px;color:var(--muted)}
.profile-bio{font-size:14px;white-space:pre-wrap}
.profile-tabs{display:flex;justify-content:center;gap:0;border-top:1px solid var(--border);margin-top:16px}
.profile-tab{flex:1;max-width:180px;padding:16px 0;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;cursor:pointer;border:none;background:none;color:var(--muted);border-top:1px solid transparent;margin-top:-1px;display:flex;align-items:center;justify-content:center;gap:6px;transition:color .15s}
.profile-tab.active{color:var(--text);border-top-color:var(--text)}
.profile-posts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding-top:4px}
.profile-tile{aspect-ratio:1;overflow:hidden;cursor:pointer;position:relative;background:var(--s3)}
.profile-tile img{width:100%;height:100%;object-fit:cover;transition:filter .2s}
.profile-tile:hover img{filter:brightness(.75)}

/* ── DM ── */
.dm-wrap{display:flex;height:100vh;width:100%;max-width:935px;border:1px solid var(--border);border-top:none;border-bottom:none}
.dm-list{width:350px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column}
.dm-list-hdr{padding:18px 20px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.dm-hdr-name{font-size:16px;font-weight:700}
.dm-hdr-btn{background:none;border:none;color:var(--text);padding:4px;display:flex;align-items:center;border-radius:4px}
.dm-hdr-btn:hover{background:var(--s3)}
.dm-hdr-btn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dm-conv-list{flex:1;overflow-y:auto}
.dm-conv-item{display:flex;align-items:center;gap:12px;padding:10px 20px;cursor:pointer;transition:background .1s;border:none;background:none;color:var(--text);width:100%;text-align:left}
.dm-conv-item:hover{background:var(--s2)}
.dm-conv-item.active{background:var(--s2)}
.dm-conv-av{width:56px;height:56px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--border);position:relative}
.dm-ai-dot{position:absolute;bottom:2px;right:2px;width:12px;height:12px;background:var(--accent);border-radius:50%;border:2px solid var(--bg)}
.dm-conv-meta{flex:1;min-width:0}
.dm-conv-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.dm-ai-badge{font-size:10px;background:var(--accent);color:#fff;padding:1px 5px;border-radius:4px;font-weight:700;flex-shrink:0}
.dm-conv-preview{color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm-chat{flex:1;display:flex;flex-direction:column}
.dm-chat-hdr{padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
.dm-chat-av{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--border)}
.dm-chat-name{font-weight:600;font-size:15px}
.dm-chat-sub{font-size:12px;color:var(--muted)}
.dm-messages{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:6px}
.dm-msg{max-width:65%;padding:10px 14px;border-radius:22px;font-size:14px;line-height:1.45;word-break:break-word}
.dm-msg.sent{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
.dm-msg.recv{background:var(--s3);color:var(--text);align-self:flex-start;border-bottom-left-radius:6px}
.dm-msg.typing-msg{background:var(--s3);align-self:flex-start;border-bottom-left-radius:6px;padding:12px 16px}
.typing-dots{display:flex;gap:4px;align-items:center}
.typing-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:tdot 1.4s infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,80%,100%{opacity:.3;transform:scale(.9)}40%{opacity:1;transform:scale(1)}}
.dm-input-area{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-shrink:0}
.dm-input{flex:1;background:transparent;border:1px solid var(--border);border-radius:22px;padding:10px 16px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.dm-input:focus{border-color:var(--muted)}
.dm-input::placeholder{color:var(--muted)}
.dm-send{background:none;border:none;color:var(--accent);font-weight:600;font-size:14px;padding:8px;opacity:.4;transition:opacity .2s}
.dm-send.on{opacity:1}
.dm-empty-chat{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);padding:40px}
.dm-empty-icon{width:68px;height:68px;border-radius:50%;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center}
.dm-empty-icon svg{width:32px;height:32px;fill:none;stroke:var(--muted);stroke-width:2}
.dm-empty-title{font-size:20px;font-weight:300;color:var(--text)}
.dm-empty-sub{font-size:14px;text-align:center}
.dm-notice{background:rgba(0,149,246,.1);border:1px solid rgba(0,149,246,.3);border-radius:8px;padding:10px 14px;font-size:13px;color:#80caff;margin:12px 20px}

/* ── MODALS ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.post-modal{background:var(--bg);border:1px solid var(--border);border-radius:4px;display:flex;max-height:90vh;width:90vw;max-width:935px;overflow:hidden}
.pm-img-side{flex:1;min-width:0;background:var(--s3);display:flex;align-items:center;justify-content:center}
.pm-img-side img{width:100%;height:100%;max-height:90vh;object-fit:contain;display:block}
.pm-meta-side{width:340px;flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid var(--border);max-height:90vh}
.pm-hdr{display:flex;align-items:center;padding:14px 16px;gap:10px;border-bottom:1px solid var(--border);flex-shrink:0}
.pm-av{width:32px;height:32px;border-radius:50%;object-fit:cover;cursor:pointer;border:1px solid var(--border)}
.pm-username{font-weight:600;font-size:14px;cursor:pointer;background:none;border:none;color:var(--text);padding:0}
.pm-comments{flex:1;overflow-y:auto;padding:16px}
.pm-comment{margin-bottom:14px;font-size:14px;line-height:1.5}
.pm-comment strong{font-weight:600;margin-right:5px;cursor:pointer}
.pm-comment strong:hover{color:var(--muted)}
.pm-comment time{color:var(--muted);font-size:11px;margin-left:6px}
.pm-actions{border-top:1px solid var(--border);padding:8px 16px 0;flex-shrink:0;display:flex;gap:0}
.pm-likes{padding:6px 16px 4px;font-weight:600;font-size:14px;flex-shrink:0}
.pm-caption{padding:0 16px 6px;font-size:14px;flex-shrink:0;word-break:break-word}
.pm-caption strong{font-weight:600;margin-right:4px;cursor:pointer}
.pm-add-comment{display:flex;align-items:center;padding:12px 16px;gap:8px;border-top:1px solid var(--border);flex-shrink:0}
.pm-comment-input{flex:1;background:none;border:none;color:var(--text);font-size:14px;outline:none}
.pm-comment-input::placeholder{color:var(--muted)}
.pm-post-btn{background:none;border:none;color:var(--accent);font-weight:600;font-size:14px;opacity:.4;transition:opacity .2s;white-space:nowrap}
.pm-post-btn.on{opacity:1}
.modal-close-btn{position:absolute;top:16px;right:16px;background:rgba(0,0,0,.6);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;z-index:201;line-height:1}
.modal-close-btn:hover{background:rgba(255,255,255,.15)}

/* Story modal */
.story-modal{width:min(400px,100%);height:min(700px,90vh);border-radius:12px;overflow:hidden;background:var(--s3);position:relative;flex-shrink:0}
.story-modal img{width:100%;height:100%;object-fit:cover}
.story-modal-hdr{position:absolute;top:0;left:0;right:0;padding:16px;background:linear-gradient(180deg,rgba(0,0,0,.6) 0%,transparent 100%)}
.story-progress{height:2px;background:rgba(255,255,255,.4);border-radius:2px;margin-bottom:12px}
.story-progress-bar{height:100%;background:#fff;border-radius:2px;animation:storyProg 5s linear forwards}
@keyframes storyProg{from{width:0}to{width:100%}}
.story-modal-user{display:flex;align-items:center;gap:8px}
.story-modal-av{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.story-modal-name{font-weight:700;font-size:14px;color:#fff}
.story-modal-time{font-size:12px;color:rgba(255,255,255,.7)}

/* Create post modal */
.create-modal{background:var(--s1);border-radius:12px;width:90vw;max-width:680px;overflow:hidden}
.create-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
.create-title{font-size:16px;font-weight:600;flex:1;text-align:center}
.create-body{padding:24px;min-height:300px}
.upload-area{border:2px dashed var(--border);border-radius:10px;padding:48px 24px;text-align:center;cursor:pointer;transition:border-color .2s;position:relative}
.upload-area:hover{border-color:var(--muted)}
.upload-icon{font-size:48px;margin-bottom:12px}
.upload-area input{position:absolute;inset:0;opacity:0;cursor:pointer}
.caption-area{padding:0 24px 24px}
.caption-textarea{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);font-size:14px;resize:none;outline:none;padding:8px 0;min-height:80px}
.caption-textarea::placeholder{color:var(--muted)}
.create-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end}
.share-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 20px;font-weight:600;font-size:14px}
.share-btn:disabled{opacity:.5;cursor:not-allowed}

/* Settings modal */
.settings-modal{background:var(--s1);border-radius:12px;width:90vw;max-width:480px;overflow:hidden}
.settings-hdr{padding:16px 20px;border-bottom:1px solid var(--border);font-size:16px;font-weight:600;text-align:center}
.settings-body{padding:24px}
.settings-section{margin-bottom:24px}
.settings-label{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.settings-input{width:100%;background:var(--s3);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s}
.settings-input:focus{border-color:var(--accent)}
.settings-hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.5}
.settings-save{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-weight:600;font-size:14px;margin-top:4px}
.settings-save:hover{background:#0086e0}
.accounts-section{margin-top:16px}
.acc-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;color:var(--text);width:100%;text-align:left}
.acc-item:last-child{border-bottom:none}
.acc-item:hover .acc-name{color:var(--muted)}
.acc-check{margin-left:auto;color:var(--accent)}
.acc-av{width:36px;height:36px;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid var(--border)}
.acc-info{flex:1;min-width:0}
.acc-name{font-weight:600;font-size:14px}
.acc-handle{font-size:12px;color:var(--muted)}
.new-acc-form{margin-top:16px;display:grid;gap:10px}
.new-acc-input{background:var(--s3);border:1px solid var(--border);border-radius:8px;padding:10px 14px;color:var(--text);font-size:14px;outline:none;width:100%}
.new-acc-input:focus{border-color:var(--accent)}
.new-acc-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:10px;font-weight:600;font-size:14px;align-self:flex-start;padding:10px 20px}

/* Crop modal */
.crop-modal{background:var(--s1);border-radius:12px;width:90vw;max-width:520px;overflow:hidden}
.crop-hdr{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.crop-title-text{font-size:16px;font-weight:600;flex:1;text-align:center}
.crop-body{padding:20px}
.crop-vp{width:100%;aspect-ratio:1;border:1px solid var(--border);border-radius:8px;overflow:hidden;position:relative;background:#000;cursor:grab}
.crop-vp:active{cursor:grabbing}
.crop-vp img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);user-select:none;pointer-events:none}
.crop-controls{margin-top:14px;display:grid;gap:10px}
.crop-label{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:4px}
.crop-range{width:100%;accent-color:var(--accent)}
.crop-actions{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
.crop-cancel{background:var(--s3);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 16px;font-size:14px;font-weight:600}
.crop-apply{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:14px;font-weight:600}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--s3);color:var(--text);padding:12px 20px;border-radius:8px;font-size:14px;z-index:9999;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;border:1px solid var(--border)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── MISC ── */
.hidden{display:none!important}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);width:100%}
.empty-icon{font-size:48px;display:block;margin-bottom:16px}
@keyframes heartPop{0%{transform:scale(1)}30%{transform:scale(1.4)}60%{transform:scale(.95)}100%{transform:scale(1)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.post-card,.reel-card{animation:fadeIn .3s ease}

/* ── RESPONSIVE ── */
@media(max-width:1100px){.right-col,.content-wrap .right-col{display:none}}
@media(max-width:900px){.pm-meta-side{width:280px}}

  .dm-list{width:70px}

}
@media(max-width:600px){

  .profile-top{grid-template-columns:90px 1fr;gap:12px 20px}
  .profile-av-ring{width:90px;height:90px}
}

function timeAgo(ts){
  const diff=Date.now()-ts;
  if(diff<60000)return'just now';
  if(diff<3600000)return`${Math.floor(diff/60000)}m`;
  if(diff<86400000)return`${Math.floor(diff/3600000)}h`;
  if(diff<604800000)return`${Math.floor(diff/86400000)}d`;
  return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}).format(ts);
}

function makeAvatar(username,color,size=160){
  const c=document.createElement('canvas');c.width=size;c.height=size;
  const ctx=c.getContext('2d');
  const g=ctx.createLinearGradient(0,0,size,size);
  g.addColorStop(0,color);g.addColorStop(1,shiftColor(color,40));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(size/2,size/2,size/2,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.25)';ctx.beginPath();ctx.arc(size*.35,size*.35,size*.35,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#fff';ctx.font=`bold ${Math.round(size*.38)}px -apple-system,Arial`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(username[0].toUpperCase(),size/2,size/2+2);
  return c.toDataURL('image/png');
}

function shiftColor(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const r=Math.min(255,(n>>16)+amt),g=Math.min(255,((n>>8)&0xff)+amt),b=Math.min(255,(n&0xff)+amt);
  return`#${((r<<16)|(g<<8)|b).toString(16).padStart(6,'0')}`;
}

function generatePostImage(theme){
  const size=600;const c=document.createElement('canvas');c.width=size;c.height=size;
  const ctx=c.getContext('2d');const {c1,c2,c3,c4,type}=theme;
  const g=ctx.createLinearGradient(0,0,size,size);
  g.addColorStop(0,c1);g.addColorStop(.5,c2);g.addColorStop(1,c3);
  ctx.fillStyle=g;ctx.fillRect(0,0,size,size);
  if(type==='geo'){
    for(let i=0;i<6;i++){
      ctx.save();ctx.translate(Math.random()*size,Math.random()*size);
      ctx.rotate(Math.random()*Math.PI);
      ctx.fillStyle=c4+'33';ctx.fillRect(-30,-30,80+Math.random()*180,80+Math.random()*180);ctx.restore();
    }
  }else if(type==='soft'){
    for(let i=0;i<9;i++){
      const bg=ctx.createRadialGradient(Math.random()*size,Math.random()*size,10,size*.5,size*.5,size*.6);
      bg.addColorStop(0,c4+'55');bg.addColorStop(1,'transparent');
      ctx.fillStyle=bg;ctx.fillRect(0,0,size,size);
    }
  }else if(type==='warm'){
    for(let i=0;i<5;i++){
      ctx.beginPath();ctx.arc(Math.random()*size,Math.random()*size,50+Math.random()*130,0,Math.PI*2);
      ctx.fillStyle=c4+'44';ctx.fill();
    }
  }else if(type==='grid'){
    ctx.strokeStyle=c4+'55';ctx.lineWidth=1;
    for(let x=0;x<size;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,size);ctx.stroke();}
    for(let y=0;y<size;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(size,y);ctx.stroke();}
    ctx.shadowBlur=20;ctx.shadowColor=c4;
    for(let i=0;i<15;i++){const x=Math.round(Math.random()*14)*40,y=Math.round(Math.random()*14)*40;ctx.fillStyle=c4;ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();}
    ctx.shadowBlur=0;
  }else if(type==='sunset'){
    const bands=4;for(let i=0;i<bands;i++){const bg2=ctx.createLinearGradient(0,size*(i/bands),0,size*((i+1)/bands));bg2.addColorStop(0,c4+(i%2?'44':'22'));bg2.addColorStop(1,'transparent');ctx.fillStyle=bg2;ctx.fillRect(0,size*(i/bands),size,size/bands);}
  }else if(type==='waves'){
    ctx.strokeStyle=c4+'88';ctx.lineWidth=2;
    for(let i=0;i<8;i++){ctx.beginPath();ctx.moveTo(0,size*(i/8));for(let x=0;x<size;x+=10){ctx.lineTo(x,size*(i/8)+Math.sin(x*.04+i)*28);}ctx.stroke();}
  }
  const vig=ctx.createRadialGradient(size/2,size/2,size*.25,size/2,size/2,size*.8);
  vig.addColorStop(0,'transparent');vig.addColorStop(1,'rgba(0,0,0,.5)');
  ctx.fillStyle=vig;ctx.fillRect(0,0,size,size);
  return c.toDataURL('image/jpeg',.88);
}

function hydrate(){
  try{
    const raw=localStorage.getItem(SK);
    if(!raw)return;
    const d=JSON.parse(raw);
    Object.assign(S,d);
    if(!Array.isArray(S.accounts))S.accounts=[];
    if(!Array.isArray(S.posts))S.posts=[];
    if(!Array.isArray(S.follows))S.follows=[];
    if(!Array.isArray(S.saved))S.saved=[];
    if(!S.dms||typeof S.dms!=='object')S.dms={};
    if(!Array.isArray(S.storySeenIds))S.storySeenIds=[];
  }catch{localStorage.removeItem(SK);}
}
function persist(){
  try{localStorage.setItem(SK,JSON.stringify(S));}catch(e){console.warn('Storage full, clearing images...');}
}

async function seed(){
  // Generate fake user accounts
  for(const fu of FAKE_USERS){
    if(!S.accounts.find(a=>a.id===fu.id)){
      S.accounts.push({
        id:fu.id,username:fu.username,displayName:fu.displayName,
        bio:fu.bio,color:fu.color,
        avatarUrl:makeAvatar(fu.username,fu.color,200),
        followers:fu.followers,following:fu.following,
        fake:true,createdAt:NOW-Math.random()*DAY*60,
      });
    }
  }
  // Create a default user account
  if(!S.accounts.find(a=>a.id==='u_me')){
    S.accounts.push({
      id:'u_me',username:'yourhandle',displayName:'Your Name',
      bio:'Welcome to your Instagram clone! ✨\nChange your profile in Settings.',
      color:'#f5c518',avatarUrl:makeAvatar('Y','#f5c518',200),
      followers:0,following:0,fake:false,createdAt:NOW,
    });
  }
  if(!S.activeId)S.activeId='u_me';
  // Generate posts
  if(S.posts.length===0){
    const imgs=POST_THEMES.map(t=>generatePostImage(t));
    for(let i=0;i<SEED_POSTS.length;i++){
      const sp=SEED_POSTS[i];
      const post={
        id:uid(),accountId:sp.userId,imageUrl:imgs[sp.themeIdx],
        caption:sp.caption,comments:[],likes:generateFakeLikes(sp.likes,sp.userId),
        createdAt:NOW-(sp.daysAgo*DAY)-(Math.random()*DAY*.5),
      };
      S.posts.push(post);
    }
    // Add comments
    for(const sc of SEED_COMMENTS){
      if(sc.postIdx<S.posts.length){
        S.posts[sc.postIdx].comments.push({
          id:uid(),fromId:sc.userId,text:sc.text,
          createdAt:NOW-(Math.random()*DAY*2),likes:[],
        });
      }
    }
  }
  // Default follows (active user follows all fake users)
  for(const fu of FAKE_USERS){
    if(!S.follows.find(f=>f.followerId==='u_me'&&f.followingId===fu.id)){
      S.follows.push({followerId:'u_me',followingId:fu.id});
    }
  }
  S.initialized=true;
}

function generateFakeLikes(count,postUserId){
  const ids=FAKE_USERS.filter(f=>f.id!==postUserId).map(f=>f.id).slice(0,Math.min(3,count));
  return ids;
}

// GETTERS
// ═══════════════════════════════════════════════════
const getAccount=id=>S.accounts.find(a=>a.id===id)||null;
const getActive=()=>getAccount(S.activeId);
const isFollowing=targetId=>S.follows.some(f=>f.followerId===S.activeId&&f.followingId===targetId);
const isLiked=post=>Array.isArray(post.likes)&&post.likes.includes(S.activeId);
const isSaved=postId=>S.saved.includes(postId);
const getFakeUser=id=>FAKE_USERS.find(f=>f.id===id)||null;
const getConv=id=>{if(!S.dms[id])S.dms[id]=[];return S.dms[id];}
function getAvatar(account){return account?.avatarUrl||makeAvatar(account?.username||'?','#555',80);}
function getFeedPosts(){
  const followingIds=[...S.follows.filter(f=>f.followerId===S.activeId).map(f=>f.followingId),'u_me',S.activeId];
  const unique=[...new Set(followingIds)];
  return S.posts.filter(p=>unique.includes(p.accountId)).sort((a,b)=>b.createdAt-a.createdAt);
}

  const following=isFollowing(post.accountId);
  const likesCount=Array.isArray(post.likes)?post.likes.length:0;
  return`<div class="post-card" data-post-id="${post.id}">
    <div class="post-header">
      <img class="post-av" src="${getAvatar(acc)}" onclick="viewProfile('${post.accountId}')">
      <div class="post-user-info">
        <button class="post-username" onclick="viewProfile('${post.accountId}')">${esc(acc.username)}</button>
        <span class="post-dot">•</span>
        <span class="post-time">${timeAgo(post.createdAt)}</span>
        ${fakeUser&&!following?`<button class="post-follow" onclick="toggleFollow('${post.accountId}');render()">Follow</button>`:''}
      </div>
      <button class="post-more">${svg('dots')}</button>
    </div>
    <img class="post-img" src="${post.imageUrl}" onclick="openPostModal('${post.id}')">
    <div class="post-actions">
      <button class="act-btn${liked?' liked':''}" onclick="toggleLike('${post.id}')" title="Like">
        ${liked?I.heartFilled:I.heart}
      </button>
      <button class="act-btn" onclick="openPostModal('${post.id}')" title="Comment">
        ${I.comment}
      </button>
      <button class="act-btn" onclick="showToast('Link copied!')" title="Share">
        ${I.share}
      </button>
      <button class="act-btn act-save${saved?' saved':''}" onclick="toggleSave('${post.id}')" title="Save">
        ${saved?I.bookmarkFilled:I.bookmark}
      </button>
    </div>
    ${likesCount>0?`<div class="post-likes">${formatNum(likesCount)} like${likesCount!==1?'s':''}</div>`:''}
    ${post.caption?`<div class="post-caption"><span class="cap-user" onclick="viewProfile('${post.accountId}')">${esc(acc.username)}</span>${esc(post.caption)}</div>`:''}
    ${post.comments.length>1?`<button class="post-view-comments" onclick="openPostModal('${post.id}')">View all ${post.comments.length} comments</button>`:''}

      <button class="post-post-btn" onclick="quickComment(this.previousElementSibling)">Post</button>
    </div>
  </div>`;
}

    ${!hasKey?`<div class="dm-notice">⚙️ Add your Anthropic API key in <button onclick="openSettingsModal()" style="background:none;border:none;color:#80caff;font-weight:600;cursor:pointer;padding:0">Settings</button> to enable AI responses.</div>`:''}
    <div class="dm-messages" id="dm-messages">
      ${conv.length===0?`<div style="text-align:center;color:var(--muted);font-size:14px;margin:auto">Start a conversation with ${esc(acc.username)}!</div>`:''}
      ${conv.map(m=>`<div class="dm-msg ${m.role==='user'?'sent':'recv'}">${esc(m.text)}</div>`).join('')}
    </div>
    <div class="dm-input-area">
      <input class="dm-input" id="dm-text-input" placeholder="Message ${esc(acc.username)}…" oninput="document.getElementById('dm-send-btn').classList.toggle('on',this.value.trim().length>0)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();handleDmSend()}">
      <button class="dm-send" id="dm-send-btn" onclick="handleDmSend()">Send</button>
    </div>`;
}

function setupDmInput(){setTimeout(()=>{const msgs=document.getElementById('dm-messages');if(msgs)msgs.scrollTop=msgs.scrollHeight;},50);}

function openConv(userId){S.activeConvId=userId;persist();renderDMs(document.getElementById('main-area'));}

async function handleDmSend(){
  const input=document.getElementById('dm-text-input');
  if(!input)return;
  const text=input.value.trim();
  if(!text||!S.activeConvId)return;
  input.value='';
  document.getElementById('dm-send-btn')?.classList.remove('on');
  const conv=getConv(S.activeConvId);
  conv.push({role:'user',text,ts:Date.now()});
  persist();
  refreshDmMessages();
  // Show typing indicator
  const msgs=document.getElementById('dm-messages');
  if(msgs){
    const typing=document.createElement('div');
    typing.className='dm-msg typing-msg';typing.id='typing-indicator';
    typing.innerHTML=`<div class="typing-dots"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>`;
    msgs.appendChild(typing);msgs.scrollTop=msgs.scrollHeight;
  }
  if(!S.apiKey){
    setTimeout(()=>{
      document.getElementById('typing-indicator')?.remove();
      const fu=getFakeUser(S.activeConvId);
      conv.push({role:'assistant',text:`(Add your API key in Settings to chat with ${fu?.username||'me'} using AI! 🤖)`,ts:Date.now()});
      persist();refreshDmMessages();
    },1500);
    return;
  }
  // Call Claude API
  try{
    const fu=getFakeUser(S.activeConvId);
    const history=conv.slice(-20).map(m=>({role:m.role==='user'?'user':'assistant',content:m.text}));
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':S.apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:200,system:fu?.persona||'You are a friendly Instagram user.',messages:history})
    });
    const data=await resp.json();
    document.getElementById('typing-indicator')?.remove();
    if(data.content&&data.content[0]){
      conv.push({role:'assistant',text:data.content[0].text,ts:Date.now()});
    }else{
      conv.push({role:'assistant',text:'(no response)',ts:Date.now()});
    }
  }catch(e){
    document.getElementById('typing-indicator')?.remove();
    conv.push({role:'assistant',text:'(Something went wrong. Check your API key in Settings.)',ts:Date.now()});
  }
  persist();refreshDmMessages();
}

function refreshDmMessages(){
  const msgs=document.getElementById('dm-messages');if(!msgs)return;
  const conv=getConv(S.activeConvId||'');
  msgs.innerHTML=conv.map(m=>`<div class="dm-msg ${m.role==='user'?'sent':'recv'}">${esc(m.text)}</div>`).join('');
  msgs.scrollTop=msgs.scrollHeight;
}

// ═══════════════════════════════════════════════════
// RENDER: PROFILE
// ═══════════════════════════════════════════════════
function renderProfile(container,userId){
  const acc=getAccount(userId);if(!acc){container.innerHTML='<div class="empty-state">Profile not found</div>';return;}
  const posts=S.posts.filter(p=>p.accountId===userId).sort((a,b)=>b.createdAt-a.createdAt);
  const fu=getFakeUser(userId);
  const followers=fu?fu.followers+S.follows.filter(f=>f.followingId===userId).length:S.follows.filter(f=>f.followingId===userId).length;
  const following=fu?fu.following:S.follows.filter(f=>f.followerId===userId).length;
  const isMe=userId===S.activeId;
  const isFollow=isFollowing(userId);
  container.innerHTML=`<div class="profile-wrap">
    <div class="profile-top">
      <div class="profile-av-ring"><img class="profile-av-img" src="${getAvatar(acc)}"></div>
      <div class="profile-right">
        <div class="profile-name-row">
          <h2 class="profile-uname">${esc(acc.username)}</h2>
          ${isMe?`<div class="profile-action-btns"><button class="profile-btn" onclick="openSettingsModal()">Edit profile</button></div>`:
            `<div class="profile-action-btns">
              <button class="profile-btn${isFollow?' following':' primary'}" onclick="toggleFollow('${userId}');renderMain()">${isFollow?'Following':'Follow'}</button>
              <button class="profile-btn" onclick="S.view='dm';S.activeConvId='${userId}';persist();render()">Message</button>
            </div>`}
        </div>
        <div class="profile-stats">
          <div class="stat"><span class="stat-num">${posts.length}</span><span class="stat-lbl">posts</span></div>
          <div class="stat"><span class="stat-num">${formatNum(followers)}</span><span class="stat-lbl">followers</span></div>
          <div class="stat"><span class="stat-num">${formatNum(following)}</span><span class="stat-lbl">following</span></div>
        </div>
        <div class="profile-bio">${esc(acc.bio||'')}</div>
      </div>
    </div>
    <div class="profile-tabs">
      <button class="profile-tab active">${svg('grid')} Posts</button>
      <button class="profile-tab">${svg('tag')} Tagged</button>
    </div>
    <div class="profile-posts-grid">
      ${posts.length?posts.map(p=>`<div class="profile-tile" onclick="openPostModal('${p.id}')"><img src="${p.imageUrl}" loading="lazy"></div>`).join('')
        :`<div class="empty-state"><span class="empty-icon">📷</span><p>No posts yet</p></div>`}
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════
// MODALS
// ═══════════════════════════════════════════════════
function clearModal(){document.getElementById('modal-root').innerHTML='';}
function wrapModal(content,onClose){
  const root=document.getElementById('modal-root');
  root.innerHTML=`<div class="overlay" id="modal-overlay">${content}<button class="modal-close-btn" onclick="clearModal()">${I.close}</button></div>`;
  root.querySelector('#modal-overlay').addEventListener('click',e=>{if(e.target.id==='modal-overlay')clearModal();});
  if(onClose)root.querySelector('.overlay').addEventListener('custom-close',onClose);
}

function openPostModal(postId){
  const post=S.posts.find(p=>p.id===postId);if(!post)return;
  const acc=getAccount(post.accountId);if(!acc)return;
  const liked=isLiked(post);const saved=isSaved(postId);
  const likeCount=Array.isArray(post.likes)?post.likes.length:0;
  wrapModal(`<div class="post-modal">
    <div class="pm-img-side"><img src="${post.imageUrl}"></div>
    <div class="pm-meta-side">
      <div class="pm-hdr">
        <img class="pm-av" src="${getAvatar(acc)}" onclick="clearModal();viewProfile('${acc.id}')">
        <button class="pm-username" onclick="clearModal();viewProfile('${acc.id}')">${esc(acc.username)}</button>
        <button class="post-more" style="margin-left:auto">${svg('dots')}</button>
      </div>
      <div class="pm-comments" id="pm-comments-list">
        ${post.caption?`<div class="pm-comment"><strong onclick="clearModal();viewProfile('${acc.id}')">${esc(acc.username)}</strong>${esc(post.caption)}<time>${timeAgo(post.createdAt)}</time></div>`:''}
        ${post.comments.map(c=>{const ca=getAccount(c.fromId);return`<div class="pm-comment"><strong onclick="clearModal();viewProfile('${c.fromId||''}')">${esc(ca?.username||'user')}</strong>${esc(c.text)}<time>${timeAgo(c.createdAt)}</time></div>`;}).join('')}
      </div>
      <div class="pm-actions">
        <button class="act-btn${liked?' liked':''}" id="pm-like-btn" onclick="toggleLikeModal('${postId}')" title="Like">${liked?I.heartFilled:I.heart}</button>
        <button class="act-btn" onclick="document.getElementById('pm-comment-input').focus()" title="Comment">${I.comment}</button>
        <button class="act-btn" onclick="showToast('Shared!')" title="Share">${I.share}</button>
        <button class="act-btn act-save${saved?' saved':''}" onclick="toggleSave('${postId}');this.classList.toggle('saved')" title="Save">${saved?I.bookmarkFilled:I.bookmark}</button>
      </div>
      <div class="pm-likes" id="pm-likes-count">${formatNum(likeCount)} like${likeCount!==1?'s':''}</div>
      ${post.caption?`<div class="pm-caption"><strong onclick="clearModal();viewProfile('${acc.id}')">${esc(acc.username)}</strong>${esc(post.caption)}</div>`:''}
      <div class="pm-add-comment">
        <input class="pm-comment-input" id="pm-comment-input" placeholder="Add a comment…" oninput="document.getElementById('pm-post-btn').classList.toggle('on',this.value.trim().length>0)" onkeydown="if(event.key==='Enter'){document.getElementById('pm-post-btn').click()}">
        <button class="pm-post-btn" id="pm-post-btn" onclick="addCommentModal('${postId}')">Post</button>
      </div>
    </div>
  </div>`);
}

function toggleLikeModal(postId){
  const post=S.posts.find(p=>p.id===postId);if(!post)return;
  toggleLike(postId);
  const liked=isLiked(post);
  const btn=document.getElementById('pm-like-btn');
  if(btn){btn.innerHTML=liked?I.heartFilled:I.heart;btn.classList.toggle('liked',liked);}
  const lc=document.getElementById('pm-likes-count');
  if(lc){const n=Array.isArray(post.likes)?post.likes.length:0;lc.textContent=`${formatNum(n)} like${n!==1?'s':''}`;}
}

function addCommentModal(postId){
  const input=document.getElementById('pm-comment-input');if(!input)return;
  const text=input.value.trim();if(!text)return;
  addComment(postId,text);
  input.value='';
  document.getElementById('pm-post-btn')?.classList.remove('on');
  const post=S.posts.find(p=>p.id===postId);
  const list=document.getElementById('pm-comments-list');
  if(list&&post){
    const newC=post.comments[post.comments.length-1];
    const ca=getAccount(newC.fromId);
    const div=document.createElement('div');div.className='pm-comment';
    div.innerHTML=`<strong>${esc(ca?.username||'user')}</strong>${esc(newC.text)}<time>just now</time>`;
    list.appendChild(div);div.scrollIntoView({behavior:'smooth'});
  }
}

function openStory(userId){
  const fu=getFakeUser(userId);const acc=getAccount(userId);if(!acc)return;
  const posts=S.posts.filter(p=>p.accountId===userId);
  if(!posts.length){showToast(`${acc.username} has no stories yet`);return;}
  const post=posts[Math.floor(Math.random()*posts.length)];
  wrapModal(`<div class="story-modal">
    <img src="${post.imageUrl}">
    <div class="story-modal-hdr">
      <div class="story-progress"><div class="story-progress-bar" onanimationend="clearModal()"></div></div>
      <div class="story-modal-user">
        <img class="story-modal-av" src="${getAvatar(acc)}">
        <div>
          <div class="story-modal-name">${esc(acc.username)}</div>
          <div class="story-modal-time">${timeAgo(post.createdAt)}</div>
        </div>
      </div>
    </div>
  </div>`);
  if(!S.storySeenIds.includes(userId)){S.storySeenIds.push(userId);persist();}
}

let cropState={file:null,img:null,zoom:1,x:0,y:0,dragging:false,dx:0,dy:0,base:1,postCaption:''};
let pendingImageUrl=null;

function openCreateModal(){
  wrapModal(`<div class="create-modal">
    <div class="create-hdr">
      <button onclick="clearModal()" style="background:none;border:none;color:var(--text);font-size:14px">Cancel</button>
      <div class="create-title">Create new post</div>
      <div style="width:60px"></div>
    </div>
    <div class="create-body" id="create-body">
      <div class="upload-area">
        <div class="upload-icon">🖼️</div>
        <p style="font-size:16px;margin-bottom:8px">Drag photos and videos here</p>
        <p style="font-size:14px;color:var(--muted);margin-bottom:16px">or</p>
        <button onclick="this.previousElementSibling.previousElementSibling.previousElementSibling.click()" style="background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-weight:600">Select from computer</button>
        <input type="file" accept="image/*" onchange="handleCreateImageSelected(this.files[0])">
      </div>
    </div>
  </div>`);
}

function handleCreateImageSelected(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const url=e.target.result;
    pendingImageUrl=url;
    const body=document.getElementById('create-body');
    if(!body)return;
    body.innerHTML=`
      <div style="text-align:center;margin-bottom:16px">
        <img src="${url}" style="max-width:100%;max-height:300px;border-radius:8px;object-fit:cover">
      </div>
      <div class="caption-area" style="padding:0">
        <textarea class="caption-textarea" id="new-post-caption" placeholder="Write a caption…" rows="3"></textarea>
      </div>
      <div class="create-footer" style="padding:12px 0 0;border:none">
        <button class="share-btn" onclick="submitNewPost()">Share</button>
      </div>`;
  };
  reader.readAsDataURL(file);
}

function submitNewPost(){
  if(!pendingImageUrl||!S.activeId)return;
  const caption=document.getElementById('new-post-caption')?.value||'';
  S.posts.unshift({id:uid(),accountId:S.activeId,imageUrl:pendingImageUrl,caption,comments:[],likes:[],createdAt:Date.now()});
  pendingImageUrl=null;persist();clearModal();render();showToast('Post shared! ✨');
}

function openSettingsModal(){
  const active=getActive();
  wrapModal(`<div class="settings-modal">
    <div class="settings-hdr">⚙️ Settings</div>
    <div class="settings-body">
      <div class="settings-section">
        <div class="settings-label">AI DM — Anthropic API Key</div>
        <input class="settings-input" id="api-key-input" type="password" placeholder="sk-ant-..." value="${esc(S.apiKey)}">
        <div class="settings-hint">Used only for AI persona DMs. Stored locally in your browser. Get a key at <a href="https://console.anthropic.com" target="_blank" style="color:var(--accent)">console.anthropic.com</a>.</div>
        <button class="settings-save" style="margin-top:10px" onclick="saveApiKey()">Save API Key</button>
      </div>
      <div class="settings-section">
        <div class="settings-label">Accounts</div>
        <div class="accounts-section">
          ${S.accounts.filter(a=>!a.fake).map(a=>`<button class="acc-item" onclick="switchAccount('${a.id}')">
            <img class="acc-av" src="${getAvatar(a)}">
            <div class="acc-info"><div class="acc-name">${esc(a.username)}</div><div class="acc-handle">${esc(a.displayName||'')}</div></div>
            ${a.id===S.activeId?`<span class="acc-check">✓</span>`:''}
          </button>`).join('')}
        </div>
        <div class="settings-label" style="margin-top:16px">Add Account</div>
        <div class="new-acc-form">
          <input class="new-acc-input" id="new-username" placeholder="Username" maxlength="24">
          <input class="new-acc-input" id="new-displayname" placeholder="Display name">
          <button class="new-acc-btn" onclick="addNewAccount()">Add account</button>
        </div>
      </div>
      <div class="settings-section">
        <div class="settings-label">Data</div>
        <button onclick="resetData()" style="background:var(--s3);border:1px solid var(--border);color:var(--like);border-radius:8px;padding:8px 16px;font-weight:600;font-size:14px">Reset all data</button>
      </div>
    </div>
  </div>`);
}

function saveApiKey(){S.apiKey=document.getElementById('api-key-input')?.value||'';persist();clearModal();showToast('API key saved ✓');}

function addNewAccount(){
  const u=(document.getElementById('new-username')?.value||'').trim().toLowerCase().replace(/[^a-z0-9._]/g,'');
  const d=(document.getElementById('new-displayname')?.value||'').trim();
  if(!u){showToast('Enter a username');return;}
  if(S.accounts.find(a=>a.username===u)){showToast('Username taken');return;}
  const colors=['#e11d48','#7c3aed','#0ea5e9','#10b981','#f59e0b','#ec4899'];
  const color=colors[Math.floor(Math.random()*colors.length)];
  S.accounts.push({id:uid(),username:u,displayName:d||u,bio:'',color,avatarUrl:makeAvatar(u,color,200),followers:0,following:0,fake:false,createdAt:Date.now()});
  S.activeId=S.accounts[S.accounts.length-1].id;persist();clearModal();render();showToast(`@${u} added!`);
}

function switchAccount(id){S.activeId=id;persist();clearModal();render();showToast(`Switched to @${getAccount(id)?.username}`);}

// ═══════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════
function toggleLike(postId){
  const post=S.posts.find(p=>p.id===postId);if(!post||!S.activeId)return;
  if(!Array.isArray(post.likes))post.likes=[];
  const idx=post.likes.indexOf(S.activeId);
  if(idx===-1)post.likes.push(S.activeId);else post.likes.splice(idx,1);
  persist();
}

function toggleSave(postId){
  const idx=S.saved.indexOf(postId);
  if(idx===-1)S.saved.push(postId);else S.saved.splice(idx,1);
  persist();showToast(idx===-1?'Saved!':'Removed from saved');
}

function toggleFollow(targetId){
  if(!S.activeId||targetId===S.activeId)return;
  const idx=S.follows.findIndex(f=>f.followerId===S.activeId&&f.followingId===targetId);
  if(idx===-1)S.follows.push({followerId:S.activeId,followingId:targetId});
  else S.follows.splice(idx,1);
  persist();
}

function addComment(postId,text){
  const post=S.posts.find(p=>p.id===postId);if(!post||!text.trim())return;
  post.comments.push({id:uid(),fromId:S.activeId,text:text.trim(),likes:[],createdAt:Date.now()});
  persist();render();
}

function quickComment(input){
  const text=input.value.trim();const postId=input.dataset.post;
  if(!text||!postId)return;
  addComment(postId,text);input.value='';
}

function setView(v){S.view=v;if(v==='profile'&&!S.profileId)S.profileId=S.activeId;persist();render();}
function viewProfile(id){S.profileId=id;S.view='profile';persist();render();}
function resetData(){if(!confirm('Reset all data?'))return;localStorage.removeItem(SK);location.reload();}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
async function init(){
  hydrate();
  if(!S.initialized)await seed();
  if(!S.activeId&&S.accounts.length)S.activeId=S.accounts[0].id;
  persist();render();
}

init();
</script>
